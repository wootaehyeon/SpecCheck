<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상세 분석 - AI PC 견적 평가 시스템</title>
    <link rel="stylesheet" href="css/style.css?v=estimate-2" />
  </head>
  <body>
    <header>
      <div class="logo">AI PC 견적 평가</div>
      <nav>
        <button onclick="navigateTo('monitor')">내 PC 모니터링</button>
        <button onclick="navigateTo('main')">메인</button>
        <button onclick="navigateTo('input')">견적 입력</button>
        <button onclick="navigateTo('result')">분석 결과</button>
        <button onclick="navigateTo('detail')">상세 분석</button>
        <button onclick="navigateTo('recommend')">교체 추천</button>
        <button onclick="navigateTo('crawl')">시장 조사</button>
      </nav>
    </header>

    <main>
      <section class="page active">
        <div class="section-title">
          <h2>상세 분석</h2>
          <p>가격, 성능, 호환성, 최신성 항목별 분석 결과입니다.</p>
        </div>

        <div class="card">
          <h3>가격 분석</h3>
          <p id="priceDetail">상세 분석 결과가 여기에 표시됩니다.</p>

        </div>

        <div class="card">
          <h3>성능 밸런스</h3>
          <p id="balanceDetail">상세 분석 결과가 여기에 표시됩니다.</p>

        </div>

        <div class="card">
          <h3>호환성</h3>
          <p id="compatibilityDetail">상세 분석 결과가 여기에 표시됩니다.</p>

        </div>

        <div class="card">
          <h3>최신성</h3>
          <p id="recencyDetail">상세 분석 결과가 여기에 표시됩니다.</p>

        </div>

        <div class="button-row">
          <button class="btn btn-secondary" onclick="navigateTo('result')">
            분석 결과로
          </button>
        </div>
      </section>
    </main>

    <script src="js/estimate-engine.js?v=estimate-2"></script>
    <script src="js/script.js?v=estimate-2"></script>
  </body>
</html>
