name: Deployment checks

on:
  push:
    branches: ["codex/public-deployment"]
  pull_request:
    paths:
      - ".github/workflows/deployment-check.yml"
      - ".python-version"
      - "render.yaml"
      - "backend/**"
      - "frontend/web/**"
      - "agent/**"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: speccheck_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONITOR_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/speccheck_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-web.txt
      - run: python -m pip install -r backend/requirements-web.txt pytest==8.2.0
      - run: python -m pytest backend/tests -q -c backend/pytest.ini
      - run: python -m pytest tests -q
        working-directory: agent
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check frontend/web/js/script.js
      - run: node --check frontend/web/js/monitor.js
      - run: node --check frontend/web/js/purchase-context.js
      - run: node --check frontend/web/js/purchase.js
      - run: npm ci
        working-directory: frontend/tests
      - run: npx playwright install --with-deps chromium
        working-directory: frontend/tests
      - run: npm test
        working-directory: frontend/tests
